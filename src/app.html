<!doctype html>
<html lang="ja" data-suisou-theme="hadal" data-suisou-accent="clown">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/wixdex.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="WIXOSSのデッキ構築ツール" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/wixdex.png" />

    <!-- OGP 全ページ共通デフォルト。
         og:title / og:description / og:url は各ページの <svelte:head> で個別に指定する
         （ここに書くと先勝ちでページ側を上書きしてしまうため、ここには置かない）。
         og:image は絶対URL必須。画像は static/og.png（1200x630）を差し替えれば即反映。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wixdex" />
    <meta property="og:image" content="https://wixdex.cards/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="wixdex — WIXOSS デッキビルダー" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://wixdex.cards/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Suisou（デザイン体系）。/v1/ は v1 系の最新。凍結したくなったら /v/<sha7>/ に切り替える。
         app.css より先に読む ―― 同じ詳細度なら現場（app.css）が勝つ順序にする -->
    <link rel="stylesheet" href="https://shiro-ka.github.io/Suisou/v1/suisou.css" />
    %sveltekit.head%
  </head>
  <body data-suisou-root data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
