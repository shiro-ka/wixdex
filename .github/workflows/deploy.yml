name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main # → production (wixdex.cards)
      - dev  # → preview    (dev.wixdex.pages.dev)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ★ブリッジの取りこぼし検査。@theme に無い色クラスは黙って素通りして
      #   Tailwind の生の色が出る（neutral-700 と white で2回やられている）。
      - name: Check Suisou bridge
        run: npm run lint:bridge

      - name: Build
        run: npm run build
        env:
          VITE_CARD_IMAGE_BASE_URL: ${{ vars.VITE_CARD_IMAGE_BASE_URL }}

      # ---- production (main) : 本番 D1 へ適用 ----
      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---- preview (dev) : staging D1 へ適用 ----
      - name: Apply D1 migrations (staging)
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler d1 migrations apply DB --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ブランチ名を渡すと wrangler が production/preview を自動判定
      # (main = 本番デプロイ, それ以外 = プレビューデプロイ)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=wixdex --branch=${{ github.ref_name }}
