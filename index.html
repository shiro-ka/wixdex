<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wixdex</title>
    <link rel="icon" href="img/favicon/wixdex - 256×256.png" type="image/png">
    <link rel="stylesheet" href="assets/yu.css">
</head>
<body>
    <header>
    </header>
    <main>
        <div class="flex container">
            <div class="flex deck-container">
                <!-- ルリグデッキ欄 -->
                <div class="lrig-deck-container">
                    <div class="deck-header">
                        <div class="text-icon">
                            <img src="img/girl/LrigDeck - 512×128.png">
                        </div>
                    </div>
                    <div class="deck lrig-deck">
                        <div class="grid lrig-deck"></div>
                    </div>
                </div>
                <!-- メインデッキ欄 -->
                <div class="main-deck-container">
                    <div class="deck-header">
                        <div class="text-icon">
                            <img src="img/girl/MainDeck - 512×128.png">
                        </div>
                    </div>
                    <div class="deck main-deck">
                        <div class="grid main-deck"></div>
                    </div>
                </div>
            </div>
            <div class="flex search-container">
                <!-- カードリスト欄 -->
                <div class="cards-list-container">
                    <div class="grid cards-list"></div>
                </div>
                <!-- 検索ツール欄 -->
                <div class="search-tool-container">
                    <div class="grid search-tool">
                        <div class="search-level-container"></div>
                        <div class="search-color-container"></div>
                        <div class="search-lb-container"></div>
                        <div class="search-cardType-button"></div>
                        <div class="search-lrigTypeClass-button"></div>
                        <input type="text" class="search-text-input" placeholder="">
                        <div class="search-clear-button"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/ma.js"></script>
</body>
</html>
