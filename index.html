<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wixdex</title>
    <link rel="icon" href="img/favicon/wixdex - 256×256.png" type="image/png">
    <link rel="stylesheet" href="assets/yu.css">
</head>
<body>
    <header>
    </header>
    <main>
        <div class="main-container">
            <!-- ルリグデッキ欄 -->
            <div class="lrig-deck deck-container">
                <div class="deck-header">
                    <div class="text-icon">
                        <img src="img/girl/LrigDeck - 512×128.png">
                    </div>
                </div>
                <div class=" lrig-deck deck">
                    <div class=" lrig-deck grid"></div>
                </div>
            </div>
            <!-- メインデッキ欄 -->
            <div class="main-deck deck-container">
                <div class="deck-header">
                    <div class="text-icon">
                        <img src="img/girl/MainDeck - 512×128.png">
                    </div>
                </div>
                <div class=" main-deck deck">
                    <div class=" main-deck grid"></div>
                </div>
            </div>
            <!-- カードリスト欄 -->
            <div class="cards-list-container">
                <div class="grid cards-list"></div>
            </div>
            <!-- 検索ツール欄 -->
            <div class="search-tool-container">
                <div class="grid search-tool">
                    <div class="level search-button-container">
                        <div class="lv1 search-button" data-level="1">
                            <img src="img/icon_level/icon_lv1_stroke.png"></div>
                        <div class="lv2 search-button" data-level="2">
                            <img src="img/icon_level/icon_lv2_stroke.png"></div>
                        <div class="lv3 search-button" data-level="3">
                            <img src="img/icon_level/icon_lv3_stroke.png"></div>
                    </div>
                    <div class="color search-button-container">
                        <div class="white search-button" data-color="白">
                            <img src="img/icon_color/icon_white_stroke.png"></div>
                        <div class="red search-button" data-color="赤">
                            <img src="img/icon_color/icon_red_stroke.png"></div>
                        <div class="blue search-button" data-color="青">
                            <img src="img/icon_color/icon_blue_stroke.png"></div>
                        <div class="green search-button" data-color="緑">
                            <img src="img/icon_color/icon_green_stroke.png"></div>
                        <div class="black search-button" data-color="黒">
                            <img src="img/icon_color/icon_black_stroke.png"></div>
                    </div>
                    <div class="lb search-button-container">
                        <div class="lb search-button"></div>
                    </div>
                    <div class="popup search-button-container">
                        <div class="popup search-button" data-cardtype=""></div>
                    </div>
                    <div class="text search-button-container">
                        <input type="text" class="search-text-input" placeholder="">
                    </div>
                    <div class="clear search-button-container">
                        <div class="clear search-button"></div>
                    </div>
                </div>
            </div>
            <!-- 検索ポップアップ -->
            <div class="search-tool popup-container"></div>
            <!-- オーバーレイ -->
            <div class="search-tool popup-overlay"></div>
        </div>
        <!-- カード詳細ポップアップ -->
        <div class="card-detail popup-container">
            <div class="card-container">
                <img src=""></div>
        </div>

        <div class="card-detail popup-overlay"></div>
    </main>
    <script src="assets/ma.js"></script>
</body>
</html>
